<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tofik Linux — Debian-based</title>
    <meta name="description" content="Tofik Linux — стабильный, лёгкий и дружелюбный дистрибутив на базе Debian 12.">

    <link rel="icon" type="image/png" href="images/logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="dark">

    <div class="bg-blob one"></div>
    <div class="bg-blob two"></div>

    <div class="theme-switch" id="themeSwitch" title="Переключить тему">
        <div class="icons">
            <span class="moon">🌙</span>
            <span class="sun">☀️</span>
        </div>
        <div class="thumb"></div>
    </div>

    <div class="content">
        <div class="logo-container">
            <img src="images/logo.png" alt="Tofik Linux Logo">
        </div>

        <span class="badge">На базе Debian 12</span>
        <h1>Tofik Linux</h1>

        <p class="tagline">
            Стабильный, лёгкий и дружелюбный дистрибутив для повседневной работы.
        </p>

        <p class="story">
            Назван в честь йорка <span class="name">Тофика</span> — он просто крутой.
        </p>

        <div class="buttons">
            <a href="https://github.com/tofik-linux/tofik/releases" class="btn btn-primary" target="_blank" rel="noopener">Скачать ISO(скоро)</a>
        </div>

        <div class="author-links">
            <a href="https://github.com/tofik-linux" target="_blank" rel="noopener">GitHub</a>
            <span class="dot">·</span>
            <a href="https://t.me/tofiklinux" target="_blank" rel="noopener">Наш Telegram-канал</a>
        </div>
    </div>

    <footer></footer>

    <script src="js/theme.js"></script>
</body>
</html>
